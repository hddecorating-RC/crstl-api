<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HD Decorating · Invoice Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .row-selected { background-color: #eff6ff; }
    .row-active { border-left: 3px solid #2563eb; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen" x-data="dashboard()" x-init="init()" x-cloak @keydown.escape.window="activeInvoice = null">

  <!-- Toast -->
  <div x-show="toast" x-transition class="fixed top-4 right-4 bg-green-600 text-white px-4 py-2 rounded shadow-lg z-50 text-sm" x-text="toast"></div>

  <!-- Top bar -->
  <div class="bg-slate-900 text-slate-100 px-6 py-3 flex items-center justify-between">
    <span class="font-semibold text-sm">HD Decorating &middot; Invoice Dashboard</span>
    <div class="flex items-center gap-3 text-xs text-slate-400">
      <span x-show="lastSynced">Last sync: <span x-text="fmtTime(lastSynced)"></span></span>
      <span x-show="!lastSynced">Never synced</span>
      <span :class="syncStatus === 'ok' ? 'text-green-400' : 'text-red-400'" x-text="syncStatus === 'ok' ? '● Live' : '● Error'"></span>
    </div>
  </div>

  <div class="px-6 py-5">

    <!-- Stat cards -->
    <div class="grid grid-cols-6 gap-4 mb-5">
      <div class="bg-white rounded-lg border border-gray-200 p-4 cursor-pointer hover:border-amber-400 transition"
           :class="activeFilter === 'Draft' ? 'ring-2 ring-amber-400' : ''"
           @click="activeFilter = activeFilter === 'Draft' ? 'All' : 'Draft'; currentPage = 1">
        <div class="text-xs uppercase tracking-wide text-gray-400 mb-1">Draft</div>
        <div class="text-3xl font-bold text-amber-500" x-text="counts.Draft"></div>
        <div class="text-xs text-gray-400 mt-1">Not yet sent</div>
      </div>
      <div class="bg-white rounded-lg border border-gray-200 p-4 cursor-pointer hover:border-green-400 transition"
           :class="activeFilter === 'Sent' ? 'ring-2 ring-green-400' : ''"
           @click="activeFilter = activeFilter === 'Sent' ? 'All' : 'Sent'; currentPage = 1">
        <div class="text-xs uppercase tracking-wide text-gray-400 mb-1">Sent</div>
        <div class="text-3xl font-bold text-green-500" x-text="counts.Sent"></div>
        <div class="text-xs text-gray-400 mt-1">Transmitted to HD</div>
      </div>
      <div class="bg-white rounded-lg border border-gray-200 p-4">
        <div class="text-xs uppercase tracking-wide text-gray-400 mb-1">Total Value</div>
        <div class="text-3xl font-bold text-slate-800" x-text="fmtMoney(totalValue)"></div>
        <div class="text-xs text-gray-400 mt-1">All invoices</div>
      </div>
      <div class="bg-white rounded-lg border border-gray-200 p-4">
        <div class="text-xs uppercase tracking-wide text-gray-400 mb-1">Last Export</div>
        <div class="text-sm font-semibold text-slate-800 mt-1" x-text="lastExport ? fmtTime(lastExport) : '—'"></div>
        <div class="text-xs text-green-500 mt-1" x-show="lastExport">✓ Success</div>
      </div>
      <!-- NetSuite Export -->
      <div class="bg-white rounded-lg border border-gray-200 p-4">
        <div class="text-xs uppercase tracking-wide text-gray-400 mb-1">NetSuite Export</div>
        <div class="text-sm font-semibold text-slate-800 mt-1"
             x-text="netsuiteExport.last_generated ? fmtTime(netsuiteExport.last_generated) : '—'"></div>
        <div class="text-xs text-gray-400 mt-1"
             x-show="netsuiteExport.last_generated"
             x-text="netsuiteExport.count + ' invoices'"></div>
        <div class="text-xs text-red-500 mt-1"
             x-show="netsuiteExport.error"
             x-text="netsuiteExport.error"></div>
        <div class="flex gap-2 mt-2">
          <button @click="generateNetsuite()" :disabled="generatingNetsuite"
                  class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium px-2 py-1 rounded disabled:opacity-50">
            <span x-show="!generatingNetsuite">⟳ Generate</span>
            <span x-show="generatingNetsuite">Generating…</span>
          </button>
          <a x-show="netsuiteExport.available"
             href="/api/netsuite-export/download"
             class="text-xs bg-green-600 hover:bg-green-700 text-white font-medium px-2 py-1 rounded inline-block">
            ↓ Download
          </a>
        </div>
      </div>
      <!-- Email Digest -->
      <div class="bg-white rounded-lg border border-gray-200 p-4">
        <div class="flex items-start justify-between mb-1">
          <div class="text-xs uppercase tracking-wide text-gray-400">Email Digest</div>
          <!-- Auto-send toggle — persists in tracking.db, survives restarts.
               When off, the scheduled 07:15 job skips sending. Manual sends
               below still work. -->
          <button @click="toggleAutoDigest()" :disabled="togglingAutoDigest"
                  :class="digest.auto_enabled ? 'bg-green-500' : 'bg-gray-300'"
                  class="relative inline-flex h-4 w-8 items-center rounded-full transition disabled:opacity-50"
                  :title="digest.auto_enabled ? 'Auto-send ON — click to disable scheduled digest' : 'Auto-send OFF — scheduled digest will not fire'">
            <span :class="digest.auto_enabled ? 'translate-x-4' : 'translate-x-0.5'"
                  class="inline-block h-3 w-3 transform rounded-full bg-white transition"></span>
          </button>
        </div>
        <div class="text-sm font-semibold text-slate-800 mt-1"
             x-text="digest.last_sent ? fmtTime(digest.last_sent) : '—'"></div>
        <div class="text-xs mt-1"
             :class="digest.auto_enabled ? 'text-gray-400' : 'text-amber-600 font-medium'"
             x-text="digest.auto_enabled ? ((digest.count || 0) + ' invoice' + (digest.count === 1 ? '' : 's') + ' · Auto: on') : 'Auto: OFF (07:15 job disabled)'"></div>
        <div class="text-xs text-red-500 mt-1 truncate"
             x-show="digest.error"
             :title="digest.error"
             x-text="digest.error"></div>
        <div class="flex gap-2 mt-2">
          <button @click="sendDigest()" :disabled="sendingDigest"
                  class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium px-2 py-1 rounded disabled:opacity-50"
                  title="Send digest email of any invoices not yet emailed">
            <span x-show="!sendingDigest">✉ Send Now</span>
            <span x-show="sendingDigest">Sending…</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Toolbar — search/filters left, selection actions right (no layout shift) -->
    <div class="flex flex-wrap items-center gap-3 mb-3">
      <!-- Search -->
      <div class="flex-1 min-w-48 relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">🔍</span>
        <input type="text" x-model="search" @input="currentPage = 1" placeholder="Search invoice #, PO #..."
               class="w-full pl-9 pr-4 py-2 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <!-- Date range -->
      <div class="flex items-center gap-1.5 text-sm">
        <label class="text-xs text-gray-400 font-medium">From</label>
        <input type="date" x-model="dateFrom" @change="currentPage = 1"
               class="px-2 py-1.5 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <label class="text-xs text-gray-400 font-medium">To</label>
        <input type="date" x-model="dateTo" @change="currentPage = 1"
               class="px-2 py-1.5 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button x-show="dateFrom || dateTo" @click="dateFrom = ''; dateTo = ''; currentPage = 1"
                class="text-xs text-gray-400 hover:text-gray-600 px-1">✕</button>
      </div>
      <!-- Status filters OR selection actions — same row, no shift -->
      <div class="flex items-center gap-2">
        <template x-if="selected.size === 0">
          <div class="flex items-center gap-2">
            <template x-for="f in ['All','Draft','Sent']" :key="f">
              <button @click="activeFilter = f; currentPage = 1"
                      :class="activeFilter === f ? 'bg-blue-600 text-white' : 'bg-white text-gray-500 border border-gray-200 hover:border-blue-400'"
                      class="px-4 py-2 rounded-full text-xs font-medium transition" x-text="f"></button>
            </template>
            <!-- Export state filter — independent of status. Lets you see
                 "invoices I already emailed", "invoices I haven't downloaded",
                 etc., without losing the Draft/Sent status filter. -->
            <select x-model="exportStateFilter" @change="currentPage = 1"
                    class="px-3 py-1.5 text-xs border border-gray-200 rounded-full bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-600"
                    title="Filter by CSV download / email digest history">
              <option value="Any">All export states</option>
              <option value="Emailed">Emailed ✉</option>
              <option value="NotEmailed">Not emailed</option>
              <option value="Exported">CSV exported ↓</option>
              <option value="NotExported">Not CSV exported</option>
            </select>
          </div>
        </template>
        <template x-if="selected.size > 0">
          <div class="flex items-center gap-2">
            <span class="text-sm font-medium text-blue-700" x-text="`${selected.size} selected`"></span>
            <button @click="exportCsv()" :disabled="exporting"
                    class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium px-3 py-2 rounded-full disabled:opacity-50">
              <span x-show="!exporting">↓ Export</span>
              <span x-show="exporting">Exporting…</span>
            </button>
            <button @click="emailSelected()" :disabled="sendingDigest"
                    class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-medium px-3 py-2 rounded-full disabled:opacity-50">
              <span x-show="!sendingDigest">✉ Email Selected</span>
              <span x-show="sendingDigest">Sending…</span>
            </button>
            <button @click="selected = new Set()" class="text-xs text-gray-400 hover:text-gray-600 px-1">✕</button>
          </div>
        </template>
      </div>
    </div>

    <!-- Master list (full width; detail opens as right-side drawer) -->
    <div style="height: calc(100vh - 320px); min-height: 400px;">

      <div class="h-full bg-white border border-gray-200 rounded-lg overflow-hidden flex flex-col">
        <!-- Table header -->
        <div class="grid text-xs font-semibold text-gray-400 uppercase tracking-wide px-4 py-2 border-b border-gray-100 bg-gray-50"
             style="grid-template-columns: 32px 1fr 1fr 100px 80px 90px 70px">
          <span><input type="checkbox" @change="toggleAll($event)" class="w-3.5 h-3.5"></span>
          <button @click="toggleSort('invoice_number')" class="text-left hover:text-slate-700 flex items-center gap-1">
            Invoice #<span class="text-[10px]" x-text="sortArrow('invoice_number')"></span>
          </button>
          <button @click="toggleSort('po_number')" class="text-left hover:text-slate-700 flex items-center gap-1">
            PO #<span class="text-[10px]" x-text="sortArrow('po_number')"></span>
          </button>
          <button @click="toggleSort('invoice_date')" class="text-left hover:text-slate-700 flex items-center gap-1">
            Date<span class="text-[10px]" x-text="sortArrow('invoice_date')"></span>
          </button>
          <button @click="toggleSort('total_amount')" class="text-left hover:text-slate-700 flex items-center gap-1">
            Total<span class="text-[10px]" x-text="sortArrow('total_amount')"></span>
          </button>
          <button @click="toggleSort('status')" class="text-left hover:text-slate-700 flex items-center gap-1">
            Status<span class="text-[10px]" x-text="sortArrow('status')"></span>
          </button>
          <button @click="toggleSort('exported_at')" class="text-left hover:text-slate-700 flex items-center gap-1">
            Exported<span class="text-[10px]" x-text="sortArrow('exported_at')"></span>
          </button>
        </div>
        <!-- Rows -->
        <div class="overflow-y-auto flex-1">
          <template x-if="loading">
            <div class="flex items-center justify-center h-32 text-gray-400 text-sm">Loading invoices…</div>
          </template>
          <template x-if="!loading && filteredInvoices.length === 0">
            <div class="flex items-center justify-center h-32 text-gray-400 text-sm">No invoices found</div>
          </template>
          <!-- Prefer transaction_id (stable across sort/refresh so Alpine can
               reuse DOM nodes), fall back to index if Crstl ever emits an
               empty id again — the extraction shadowing bug that collapsed
               ~two-thirds of rows to a single key was fixed in crstl.py, but
               the fallback is cheap insurance. -->
          <template x-for="(inv, i) in pagedInvoices" :key="inv.transaction_id || i">
            <div class="grid items-center px-4 py-2.5 border-b border-gray-50 cursor-pointer hover:bg-gray-50 text-sm transition"
                 style="grid-template-columns: 32px 1fr 1fr 100px 80px 90px 70px"
                 :class="{'row-selected': selected.has(inv.transaction_id), 'row-active border-l-2 border-l-blue-500': activeInvoice?.transaction_id === inv.transaction_id}"
                 @click.self="selectInvoice(inv)">
              <span><input type="checkbox" :checked="selected.has(inv.transaction_id)"
                           @click.stop @change="toggleSelect(inv.transaction_id)" class="w-3.5 h-3.5"></span>
              <span class="font-medium text-slate-700 truncate" @click="selectInvoice(inv)" x-text="inv.invoice_number || inv.transaction_id"></span>
              <span class="text-gray-400 truncate" @click="selectInvoice(inv)" x-text="inv.po_number || '—'"></span>
              <span class="text-gray-400" @click="selectInvoice(inv)" x-text="inv.invoice_date || '—'"></span>
              <span class="font-medium" @click="selectInvoice(inv)" x-text="fmtMoney(inv.total_amount)"></span>
              <span @click="selectInvoice(inv)">
                <span :class="statusClass(inv.status)" class="px-2 py-0.5 rounded-full text-xs font-medium" x-text="inv.status || '—'"></span>
              </span>
              <span @click="selectInvoice(inv)">
                <span x-show="inv.exported_at"
                      class="px-1.5 py-0.5 rounded text-xs bg-gray-100 text-gray-500 font-medium"
                      x-text="inv.exported_at ? '↓ ' + fmtDate(inv.exported_at) : ''"></span>
              </span>
            </div>
          </template>
        </div>
        <!-- Pagination footer -->
        <div class="px-4 py-2 border-t border-gray-100 bg-gray-50 flex items-center justify-between gap-3 text-xs text-gray-400">
          <span x-text="`${filteredInvoices.length} of ${invoices.length} invoices`"></span>
          <div class="flex items-center gap-2">
            <label class="text-gray-400">Per page</label>
            <select x-model.number="pageSize" @change="currentPage = 1"
                    class="border border-gray-200 rounded px-1.5 py-0.5 text-xs bg-white focus:outline-none">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
            </select>
            <button @click="currentPage = Math.max(1, currentPage - 1)" :disabled="currentPage === 1"
                    class="px-2 py-0.5 rounded border border-gray-200 bg-white hover:bg-gray-100 disabled:opacity-40">‹</button>
            <span x-text="`${currentPage} / ${totalPages}`"></span>
            <button @click="currentPage = Math.min(totalPages, currentPage + 1)" :disabled="currentPage === totalPages"
                    class="px-2 py-0.5 rounded border border-gray-200 bg-white hover:bg-gray-100 disabled:opacity-40">›</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Detail drawer (right-side flyout) -->
    <div x-show="activeInvoice" x-transition.opacity
         @click="activeInvoice = null"
         class="fixed inset-0 bg-slate-900/30 z-40"></div>
    <aside x-show="activeInvoice"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="translate-x-full"
           x-transition:enter-end="translate-x-0"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="translate-x-0"
           x-transition:leave-end="translate-x-full"
           class="fixed inset-y-0 right-0 w-full max-w-xl bg-white shadow-2xl z-50 overflow-y-auto border-l border-gray-200">
      <template x-if="activeInvoice">
        <div>
          <!-- Sticky header -->
          <div class="sticky top-0 z-10 bg-white border-b border-gray-100 px-6 py-4 flex items-center gap-3">
            <h2 class="font-bold text-slate-800 text-lg" x-text="activeInvoice.invoice_number || activeInvoice.transaction_id"></h2>
            <span :class="statusClass(activeInvoice.status)" class="px-2 py-0.5 rounded-full text-xs font-medium" x-text="activeInvoice.status"></span>
            <template x-if="crstlUrl(activeInvoice)">
              <a :href="crstlUrl(activeInvoice)" target="_blank" rel="noopener" class="text-xs text-blue-600 hover:text-blue-800 hover:underline inline-flex items-center gap-1" title="Open in Crstl">
                View in Crstl
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
              </a>
            </template>
            <button @click="activeInvoice = null" class="ml-auto p-1 rounded hover:bg-gray-100 text-gray-400 hover:text-gray-700" title="Close (Esc)">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="p-6">
            <dl class="grid grid-cols-2 gap-x-6 gap-y-4 text-sm mb-6">
              <div><dt class="text-xs text-gray-400">PO #</dt><dd class="font-medium mt-0.5" x-text="activeInvoice.po_number || '—'"></dd></div>
              <div>
                <dt class="text-xs text-gray-400">Trading Partner</dt>
                <dd class="font-medium mt-0.5" x-text="activeInvoice.trading_partner || '—'"></dd>
                <!-- Flavor (Wholesale / Dropship / DSD / etc.) — matters because HD's
                     EDI emission differs by channel: Wholesale carries full tax SACs,
                     Dropship and DSD typically omit them (so a discrepancy is expected). -->
                <template x-if="activeInvoice.trading_partner_flavor">
                  <dd class="text-xs text-gray-500 mt-0.5" x-text="activeInvoice.trading_partner_flavor"></dd>
                </template>
              </div>
              <div><dt class="text-xs text-gray-400">Invoice Date</dt><dd class="font-medium mt-0.5" x-text="activeInvoice.invoice_date || '—'"></dd></div>
              <div><dt class="text-xs text-gray-400">Due Date</dt><dd class="font-medium mt-0.5" x-text="activeInvoice.due_date || '—'"></dd></div>
              <div><dt class="text-xs text-gray-400">Subtotal</dt><dd class="font-medium mt-0.5" x-text="fmtMoney(activeInvoice.subtotal)"></dd></div>
              <template x-if="activeInvoice.province">
                <div><dt class="text-xs text-gray-400">Ship-to Province</dt><dd class="font-medium mt-0.5" x-text="activeInvoice.province"></dd></div>
              </template>
              <template x-if="activeInvoice.allowance_amount">
                <div><dt class="text-xs text-gray-400">Allowances</dt><dd class="font-medium mt-0.5 text-red-600" x-text="'−' + fmtMoney(activeInvoice.allowance_amount)"></dd></div>
              </template>
              <template x-if="activeInvoice.discount_amount">
                <div><dt class="text-xs text-gray-400">Discounts</dt><dd class="font-medium mt-0.5 text-red-600" x-text="'−' + fmtMoney(activeInvoice.discount_amount)"></dd></div>
              </template>
              <template x-if="activeInvoice.freight_amount">
                <div><dt class="text-xs text-gray-400">Freight</dt><dd class="font-medium mt-0.5" x-text="'+' + fmtMoney(activeInvoice.freight_amount)"></dd></div>
              </template>
              <template x-if="activeInvoice.fee_amount">
                <div><dt class="text-xs text-gray-400">Fees</dt><dd class="font-medium mt-0.5" x-text="'+' + fmtMoney(activeInvoice.fee_amount)"></dd></div>
              </template>

              <!-- Tax with per-kind breakdown -->
              <div class="col-span-2 border-t pt-3">
                <div class="flex items-baseline justify-between mb-2">
                  <dt class="text-xs text-gray-400 uppercase tracking-wide">Tax</dt>
                  <dd class="font-medium text-sm" x-text="fmtMoney(activeInvoice.tax_amount)"></dd>
                </div>
                <template x-if="taxBreakdownRows(activeInvoice).length > 0">
                  <div class="space-y-1 pl-3 border-l-2 border-gray-100">
                    <template x-for="row in taxBreakdownRows(activeInvoice)" :key="row.label">
                      <div class="flex items-baseline justify-between text-xs">
                        <span class="text-gray-500" x-text="row.label"></span>
                        <span class="font-mono text-gray-700" x-text="fmtMoney(row.amount)"></span>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              <div class="col-span-2 border-t pt-4">
                <dt class="text-xs text-gray-400">Total</dt>
                <dd class="text-2xl font-bold text-slate-800 mt-0.5" x-text="fmtMoney(activeInvoice.total_amount)"></dd>
              </div>
              <!-- Discrepancy warning — shows only when the invoice doesn't reconcile
                   (subtotal − allowances − discounts + freight + fees + tax ≠ total).
                   Non-zero means HD's SAC data is incomplete or wrong for this invoice. -->
              <template x-if="Math.abs(activeInvoice.discrepancy || 0) > 0.01">
                <div class="col-span-2 bg-amber-50 border border-amber-200 rounded p-3 -mt-2">
                  <dt class="text-xs font-semibold text-amber-800 uppercase tracking-wide">⚠ Unreconciled</dt>
                  <dd class="text-sm text-amber-900 mt-1">
                    <span class="font-mono font-semibold" x-text="(activeInvoice.discrepancy > 0 ? '+' : '') + fmtMoney(activeInvoice.discrepancy)"></span>
                    unexplained by SAC data.
                    <span x-show="activeInvoice.discrepancy > 0">Likely missing tax or charge code.</span>
                    <span x-show="activeInvoice.discrepancy < 0">Likely double-counted allowance or extra deduction.</span>
                    <!-- HD's Dropship and DSD channels routinely omit the tax SAC on the
                         810 (tax gets baked into the total instead). A positive residual
                         on these flavors is expected but should still be verified against
                         the value Crstl computes and displays. -->
                    <template x-if="activeInvoice.discrepancy > 0 && /dropship|dsd|direct store/i.test(activeInvoice.trading_partner_flavor || '')">
                      <div class="text-xs text-amber-800 mt-1">
                        Note: HD's <span x-text="activeInvoice.trading_partner_flavor"></span> channel commonly omits the tax SAC — cross-check the residual against the Tax Information section on Crstl before treating it as an error.
                      </div>
                    </template>
                  </dd>
                </div>
              </template>
              <div class="col-span-2"><dt class="text-xs text-gray-400">Transaction ID</dt><dd class="font-mono text-xs text-gray-500 mt-0.5" x-text="activeInvoice.transaction_id"></dd></div>
              <div class="col-span-2 border-t pt-4 mt-1">
                <dt class="text-xs text-gray-400 mb-1">Export History</dt>
                <dd class="text-xs text-gray-600 space-y-0.5">
                  <span class="block">CSV: <span x-text="activeInvoice.exported_at ? fmtTime(activeInvoice.exported_at) : '—'"></span></span>
                  <span class="block">NetSuite: <span x-text="activeInvoice.netsuite_at ? fmtTime(activeInvoice.netsuite_at) : '—'"></span></span>
                </dd>
              </div>
            </dl>
            <!-- Allowances & Charges (as invoiced on Crstl) -->
            <template x-if="activeInvoice.allowances_charges && activeInvoice.allowances_charges.length > 0">
              <div class="mb-6">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Allowances &amp; Charges</h3>
                <div class="bg-gray-50 rounded-lg overflow-hidden">
                  <div class="grid text-xs text-gray-400 px-4 py-2 border-b border-gray-200" style="grid-template-columns: 1.6fr 0.7fr 1fr 0.7fr">
                    <span>Description (Code)</span><span class="capitalize">Category</span><span class="text-right">Amount</span><span class="text-right" title="Computed as amount ÷ subtotal">% Sub</span>
                  </div>
                  <template x-for="(row, i) in activeInvoice.allowances_charges" :key="i">
                    <div class="grid text-xs px-4 py-2 border-b border-gray-100 last:border-0" style="grid-template-columns: 1.6fr 0.7fr 1fr 0.7fr">
                      <span class="truncate">
                        <span x-text="row.label || row.code || '—'"></span>
                        <span class="font-mono text-gray-400" x-show="row.label && row.code" x-text="' (' + row.code + ')'"></span>
                      </span>
                      <span class="capitalize" :class="rowColor(row.category)" x-text="row.category || row.type"></span>
                      <span class="text-right font-medium" x-text="(row.type === 'Allowance' ? '−' : '') + fmtMoney(row.amount)"></span>
                      <span class="text-right font-mono text-gray-500" x-text="pctOfSubtotal(row.amount, activeInvoice.subtotal)"></span>
                    </div>
                  </template>
                </div>
                <p class="text-xs text-gray-400 italic mt-1.5">Codes and amounts as reported on Crstl. Categories and descriptions come from the HD Canada 810 spec v6.10. % is derived (amount ÷ subtotal).</p>
              </div>
            </template>

            <!-- Line items -->
            <template x-if="activeInvoice.invoice_lines && activeInvoice.invoice_lines.length > 0">
              <div>
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Line Items</h3>
                <div class="bg-gray-50 rounded-lg overflow-hidden">
                  <div class="grid text-xs text-gray-400 px-4 py-2 border-b border-gray-200" style="grid-template-columns: 3fr 1fr 1fr 1.2fr">
                    <span>Item</span><span class="text-right">Qty</span><span class="text-right">Unit Price</span><span class="text-right">Amount</span>
                  </div>
                  <template x-for="(line, i) in activeInvoice.invoice_lines" :key="i">
                    <div class="grid text-xs px-4 py-2 border-b border-gray-100 last:border-0" style="grid-template-columns: 3fr 1fr 1fr 1.2fr">
                      <span class="truncate font-mono" x-text="line.description || line.item || '—'"></span>
                      <span class="text-right" x-text="line.quantity || '—'"></span>
                      <span class="text-right" x-text="line.unit_price != null ? fmtMoney(line.unit_price) : '—'"></span>
                      <span class="text-right font-medium" x-text="fmtMoney(line.line_amount || line.amount || 0)"></span>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </aside>

    <!-- Footer actions -->
    <div class="flex gap-3 mt-4">
      <button @click="exportAll()" :disabled="exporting || invoices.length === 0"
              class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg disabled:opacity-50 transition">
        <span x-show="!exporting">↓ Export All &amp; Download CSV</span>
        <span x-show="exporting">Exporting…</span>
      </button>
      <button @click="syncNow()" :disabled="syncing"
              class="bg-white border border-gray-200 hover:border-gray-300 text-gray-600 text-sm px-4 py-2 rounded-lg disabled:opacity-50 transition">
        <span x-show="!syncing">↻ Refresh</span>
        <span x-show="syncing">Refreshing…</span>
      </button>
      <button disabled class="bg-white border border-dashed border-gray-300 text-gray-300 text-sm px-4 py-2 rounded-lg cursor-not-allowed">
        ⬡ Push All to NetSuite
        <span class="ml-1 bg-gray-100 text-gray-400 text-xs px-1.5 py-0.5 rounded">coming soon</span>
      </button>
    </div>

  </div>

<script>
function dashboard() {
  return {
    invoices: [],
    activeInvoice: null,
    selected: new Set(),
    activeFilter: 'All',
    // Export-state dimension, independent of status filter above.
    // 'Any' | 'Emailed' | 'NotEmailed' | 'Exported' | 'NotExported'
    exportStateFilter: 'Any',
    search: '',
    dateFrom: '',
    dateTo: '',
    currentPage: 1,
    pageSize: 25,
    loading: true,
    syncing: false,
    exporting: false,
    toast: '',
    lastSynced: null,
    lastExport: null,
    syncStatus: 'never',
    netsuiteExport: { available: false, last_generated: null, count: 0, skipped: 0, error: null },
    generatingNetsuite: false,
    digest: { last_sent: null, count: 0, error: null, sending: false, auto_enabled: true },
    sendingDigest: false,
    togglingAutoDigest: false,
    sortKey: 'invoice_date',   // default: most recent first (matches prior implicit order)
    sortDir: 'desc',

    async init() {
      // Keep currentPage in range when filters/search/pageSize shrink the
      // dataset. Without this, x-model changes to pageSize or a filter that
      // reduces filteredInvoices can leave currentPage past the last page,
      // producing an empty or 1-row table even though invoices exist.
      this.$watch('totalPages', tp => {
        if (this.currentPage > tp) this.currentPage = tp;
      });
      await this.loadInvoices();
      await this.loadNetsuiteStatus();
      await this.loadDigestStatus();
      setInterval(() => this.loadInvoices(), 60000);
    },

    async loadInvoices() {
      try {
        const res = await fetch('/api/invoices');
        const data = await res.json();
        this.invoices = data.invoices || [];
        this.lastSynced = data.last_synced;
        this.syncStatus = data.status === 'ok' ? 'ok' : 'error';
      } catch {
        this.syncStatus = 'error';
      } finally {
        this.loading = false;
      }
    },

    async syncNow() {
      this.syncing = true;
      try {
        await fetch('/api/sync', { method: 'POST' });
        await this.loadInvoices();
        this.showToast('Invoices refreshed');
      } catch {
        this.syncStatus = 'error';
        this.showToast('Refresh failed');
      } finally {
        this.syncing = false;
      }
    },

    async loadNetsuiteStatus() {
      try {
        const res = await fetch('/api/netsuite-export/latest');
        this.netsuiteExport = await res.json();
      } catch {
        this.netsuiteExport = { ...this.netsuiteExport, error: 'Status unavailable' };
      }
    },

    async loadDigestStatus() {
      try {
        const res = await fetch('/api/email/status');
        this.digest = await res.json();
      } catch {
        this.digest = { ...this.digest, error: 'Status unavailable' };
      }
    },

    async toggleAutoDigest() {
      this.togglingAutoDigest = true;
      const newState = !this.digest.auto_enabled;
      try {
        const res = await fetch('/api/email/auto-digest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled: newState }),
        });
        if (!res.ok) {
          this.showToast('Toggle failed');
          return;
        }
        this.digest.auto_enabled = newState;
        this.showToast(newState ? 'Auto-digest enabled' : 'Auto-digest disabled — 07:15 job will skip');
      } catch {
        this.showToast('Toggle failed');
      } finally {
        this.togglingAutoDigest = false;
      }
    },

    async sendDigest() {
      await this._sendEmail(null);
    },

    async emailSelected() {
      if (this.selected.size === 0) return;
      await this._sendEmail([...this.selected]);
    },

    async _sendEmail(ids) {
      this.sendingDigest = true;
      try {
        const res = await fetch('/api/email/send-digest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(ids === null ? {} : { ids }),
        });
        const data = await res.json();
        if (!res.ok) {
          this.showToast('Email failed: ' + (data.message || 'Unknown error'));
          return;
        }
        const label = data.count === 0
          ? 'Sent (0 new invoices)'
          : `Sent ${data.count} invoice${data.count === 1 ? '' : 's'}`;
        this.showToast(label);
        if (ids !== null) {
          this.selected = new Set();
          await this.loadInvoices();  // refresh emailed_at markers
        }
        await this.loadDigestStatus();
      } catch {
        this.showToast('Email send failed');
      } finally {
        this.sendingDigest = false;
      }
    },

    async generateNetsuite() {
      this.generatingNetsuite = true;
      try {
        const res = await fetch('/api/netsuite-export/generate', { method: 'POST' });
        const data = await res.json();
        this.netsuiteExport = data;
        if (!res.ok) {
          this.showToast('Export failed: ' + (data.message || 'Unknown error'));
        } else if (data.available) {
          this.showToast('NetSuite export generated');
        } else if (data.error) {
          this.showToast('Export failed: ' + data.error);
        }
      } catch {
        this.showToast('NetSuite export failed');
      } finally {
        this.generatingNetsuite = false;
      }
    },

    async exportCsv() {
      this.exporting = true;
      try {
        const body = this.selected.size > 0 ? { ids: [...this.selected] } : {};
        const res = await fetch('/api/export', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          this.showToast('Export failed — try refreshing first');
          return;
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `invoices_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 100);
        this.lastExport = new Date().toISOString();
        await this.loadInvoices();
        this.showToast('CSV downloaded');
      } finally {
        this.exporting = false;
      }
    },

    async exportAll() {
      this.exporting = true;
      try {
        const res = await fetch('/api/export', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({}),
        });
        if (!res.ok) { this.showToast('Export failed — try refreshing first'); return; }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `invoices_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 100);
        this.lastExport = new Date().toISOString();
        await this.loadInvoices();
        this.showToast('CSV downloaded');
      } finally {
        this.exporting = false;
      }
    },

    selectInvoice(inv) {
      this.activeInvoice = inv;
    },

    toggleSelect(id) {
      const next = new Set(this.selected);
      next.has(id) ? next.delete(id) : next.add(id);
      this.selected = next;
    },

    toggleAll(event) {
      if (event.target.checked) {
        this.selected = new Set(this.pagedInvoices.map(i => i.transaction_id));
      } else {
        this.selected = new Set();
      }
    },

    get filteredInvoices() {
      return this.invoices.filter(inv => {
        const s = (inv.status || '').toLowerCase();
        // HD Canada sends "Draft" (unsent) and "Accepted" (received & accepted).
        // Kept "sent"/"completed"/"open" as legacy fallbacks in case another
        // trading partner uses different vocab later.
        const matchStatus = this.activeFilter === 'All' ||
          (this.activeFilter === 'Draft' && (s === 'draft' || s === 'open')) ||
          (this.activeFilter === 'Sent'  && (s === 'sent' || s === 'accepted' || s === 'completed'));
        // Export state filter (independent of status). Any = don't filter,
        // Emailed / NotEmailed / Exported / NotExported = filter by presence
        // of the respective timestamp on the invoice.
        const es = this.exportStateFilter;
        const matchExport =
          es === 'Any' ||
          (es === 'Emailed'      && !!inv.emailed_at) ||
          (es === 'NotEmailed'   && !inv.emailed_at) ||
          (es === 'Exported'     && !!inv.exported_at) ||
          (es === 'NotExported'  && !inv.exported_at);
        const q = this.search.toLowerCase();
        const matchSearch = !q ||
          (inv.invoice_number || '').toLowerCase().includes(q) ||
          (inv.po_number || '').toLowerCase().includes(q) ||
          (inv.trading_partner || '').toLowerCase().includes(q);
        const d = inv.invoice_date || '';
        const matchDate = (!this.dateFrom || d >= this.dateFrom) &&
                          (!this.dateTo   || d <= this.dateTo);
        return matchStatus && matchExport && matchSearch && matchDate;
      });
    },

    get sortedInvoices() {
      const key = this.sortKey;
      const dir = this.sortDir === 'asc' ? 1 : -1;
      const numeric = key === 'total_amount';
      // Null/undefined values always sort last, regardless of direction, so an
      // ascending sort on Exported doesn't burry all the actually-exported rows.
      return [...this.filteredInvoices].sort((a, b) => {
        const av = a[key], bv = b[key];
        const aEmpty = av == null || av === '';
        const bEmpty = bv == null || bv === '';
        if (aEmpty && bEmpty) return 0;
        if (aEmpty) return 1;
        if (bEmpty) return -1;
        if (numeric) return (av - bv) * dir;
        return String(av).localeCompare(String(bv), undefined, { numeric: true }) * dir;
      });
    },

    toggleSort(key) {
      if (this.sortKey === key) {
        this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        this.sortKey = key;
        // Sensible defaults: dates and totals go desc first (most recent / biggest);
        // text columns go asc first (A→Z).
        this.sortDir = (key === 'invoice_date' || key === 'total_amount' || key === 'exported_at') ? 'desc' : 'asc';
      }
      this.currentPage = 1;
    },

    sortArrow(key) {
      if (this.sortKey !== key) return '';
      return this.sortDir === 'asc' ? '▲' : '▼';
    },

    get totalPages() {
      return Math.max(1, Math.ceil(this.filteredInvoices.length / this.pageSize));
    },

    get pagedInvoices() {
      // Clamp currentPage so a stale value (e.g. user was on page 5 of a
      // filtered view, then widened the filter or changed pageSize) can't
      // strand the table on a nearly-empty page.
      const page = Math.min(Math.max(1, this.currentPage), this.totalPages);
      const start = (page - 1) * this.pageSize;
      return this.sortedInvoices.slice(start, start + this.pageSize);
    },

    get counts() {
      return {
        Draft: this.invoices.filter(i => { const s = (i.status||'').toLowerCase(); return s === 'draft' || s === 'open'; }).length,
        // Sent count now includes 'accepted' (HD's actual status after they
        // receive our 810). Without this the top card underreported by ~2/3.
        Sent:  this.invoices.filter(i => { const s = (i.status||'').toLowerCase(); return s === 'sent' || s === 'accepted' || s === 'completed'; }).length,
      };
    },

    get totalValue() {
      return this.invoices.reduce((sum, i) => sum + (i.total_amount || 0), 0);
    },

    statusClass(status) {
      const s = (status || '').toLowerCase();
      if (s === 'draft' || s === 'open') return 'bg-amber-100 text-amber-800';
      // Keep this in sync with counts.Sent and the filteredInvoices matcher —
      // HD's 810 pipeline reports "Accepted" once they receive the invoice.
      if (s === 'sent' || s === 'accepted' || s === 'completed') return 'bg-green-100 text-green-800';
      return 'bg-gray-100 text-gray-600';
    },

    pctOfSubtotal(amount, subtotal) {
      if (!subtotal || !amount) return '—';
      return ((amount / subtotal) * 100).toFixed(2) + '%';
    },

    taxBreakdownRows(inv) {
      const tb = inv && inv.tax_breakdown;
      if (!tb) return [];
      const labels = { GST: 'GST', HST_QST: 'HST / QST', ECO: 'BC Eco Tax', OTHER: 'Other tax' };
      return Object.entries(tb)
        .filter(([, v]) => v)
        .map(([k, v]) => ({ label: labels[k] || k, amount: v }));
    },

    rowColor(category) {
      return {
        allowance: 'text-red-600',
        discount:  'text-red-600',
        tax:       'text-amber-600',
        freight:   'text-slate-500',
        fee:       'text-slate-500',
      }[category] || 'text-slate-700';
    },

    crstlUrl(inv) {
      if (!inv || !inv.transaction_id || !inv.source_document_id) return null;
      const type = inv.source_document_type || '850';
      return `https://omnicrstl.web.app/edi/invoice/view/${inv.transaction_id}/${inv.source_document_id}?source-document-type=${type}`;
    },

    fmtMoney(val) {
      if (!val && val !== 0) return '—';
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val);
    },

    fmtTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    },

    fmtDate(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric' });
    },

    showToast(msg) {
      this.toast = msg;
      setTimeout(() => this.toast = '', 3000);
    },
  };
}
</script>
