services:
  crstl-api:
    build: .
    container_name: crstl-api
    restart: unless-stopped
    ports:
      # Change to "127.0.0.1:8000:8000" if fronting with a reverse proxy;
      # keep "8000:8000" for direct LAN access from the office.
      - "8000:8000"
    env_file:
      - .env
    environment:
      # APScheduler reads this for the daily cron jobs
      # (07:00 refresh, 07:15 digest, 04:00 NetSuite CSV).
      TZ: America/Toronto
    volumes:
      # Persist tracking.db + generated CSVs across restarts and rebuilds.
      # Leading "./" is required — a bare ".tmp" would be a named volume,
      # not a bind mount.
      - ./.tmp:/app/.tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
